

<section class="skills-section">
    <h2>TECHNICAL SKILLS</h2>

    {% if resume.skills %}
        <ul class="skills-list">

            {% for category in resume.skills %}
                <li>
                    <strong>{{ category.category }}:</strong>
                    {{ category.skills | join(", ") }}
                </li>
            {% endfor %}

        </ul>
    {% endif %}
</section>
